
name: ORION V7 Render

on:
  workflow_dispatch:
  push:
    branches:
      - feature/orion-v7-storytelling-engine
    paths:
      - "orion-app/src/**"
      - "orion-app/public/v7/**"

permissions:
  contents: read

jobs:
  lint-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: orion-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orion-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and TypeScript check
        run: npm run lint

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render ORION V7
        run: |
          mkdir -p out
          npx remotion render src/index.ts ORION-V7-ADAB-BERTETANGGA out/orion-v7-adab-bertetangga.mp4

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: ORION-V7-ADAB-BERTETANGGA
          path: orion-app/out/orion-v7-adab-bertetangga.mp4
          if-no-files-found: error
          retention-days: 7
