name: Render Remotion Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./orion-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Render Video
        run: |
          mkdir -p out
          npx remotion render MyComp out/video.mp4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: orion-app/out/video.mp4
