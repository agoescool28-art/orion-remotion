
name: ORION Motion Graphic Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-motion-graphic:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: orion-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orion-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Setup Remotion Browser
        run: npx remotion browser ensure

      - name: Render ORION MP4
        run: >
          npx remotion render
          src/index.ts
          MyComp
          out/orion-motion-graphic.mp4
          --codec h264
          --crf 23

      - name: Upload MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Motion-Graphic
          path: orion-app/out/orion-motion-graphic.mp4
          if-no-files-found: error
          retention-days: 7
